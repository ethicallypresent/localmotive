[package]
name = "lm-pipeline"
description = "One file-based LocalMotive turn: route → retrieve → draft → verify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
lm-index = { path = "../lm-index" }
lm-ollama = { path = "../lm-ollama" }
lm-retrieve = { path = "../lm-retrieve" }
lm-types.workspace = true
lm-verify = { path = "../lm-verify" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53", features = ["macros", "rt", "time"] }

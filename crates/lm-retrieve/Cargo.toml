[package]
name = "lm-retrieve"
description = "Route a question and retrieve manual chunks (FTS5 BM25 + optional vectors, RRF)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lm-retrieve"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
lm-index = { path = "../lm-index" }
lm-ollama = { path = "../lm-ollama" }
lm-types.workspace = true
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9.42"
tokio = { version = "1.53", features = ["macros", "rt"] }

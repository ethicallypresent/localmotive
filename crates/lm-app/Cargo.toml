[package]
name = "lm-app"
description = "LocalMotive desktop app (Tauri v2): dashboard, procedure walker, verified answers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
lm-index = { path = "../lm-index" }
lm-ollama = { path = "../lm-ollama" }
lm-pipeline = { path = "../lm-pipeline" }
lm-types.workspace = true
percent-encoding = "2.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.4", features = [] }
tokio = { version = "1.53", features = ["rt", "time", "sync"] }
toml = "1.1.8"
